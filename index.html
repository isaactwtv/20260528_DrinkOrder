<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>午茶時光 🥤 辦公室飲料訂購系統 </title>
  
  <!-- Google Fonts - Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316', // Orange-500
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            },
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
            }
          },
          animation: {
            'bounce-slow': 'bounce 2.5s infinite',
            'pulse-soft': 'pulse 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <style>
    /* 質感滾動條與微調 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }
    
    /* 水痕波紋淡入效果 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>
<body class="bg-[#fdfcfb] text-slate-850 font-sans min-h-screen selection:bg-orange-100 selection:text-orange-950">

  <!-- React 渲染根節點 -->
  <div id="root"></div>

  <!-- React 與頁面所有邏輯 -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // API 規格網址
    const API_URL = "https://script.google.com/macros/s/AKfycbxTGcz4LdCCPjzzFyNyKJAZoukQP_Hq3p8XHrne7QMZ9DxW0dQsnuIhGWdPxp-XpX9R/exec";

    // 內建的預設精美菜單 (當 API 載入失敗或後端無菜單時的防護與展示)
    const DEFAULT_MENU = [
      { name: "四季春青茶", price: 35, category: "原味茶類", description: "香氣清透，尾韻回甘的優質台灣春茶" },
      { name: "茉莉綠茶", price: 35, category: "原味茶類", description: "選用新鮮茉莉花與翠綠茶葉窨製而成，茶香幽雅" },
      { name: "錫蘭純紅茶", price: 35, category: "原味茶類", description: "湯色紅艷，具濃郁熟果香與錫蘭紅茶獨特喉韻" },
      { name: "經典珍珠奶茶", price: 50, category: "香醇奶茶", description: "特調醇厚奶茶搭配Q彈手作黑糖蜜珍珠" },
      { name: "英式鮮奶茶", price: 55, category: "鮮奶系列", description: "斯里蘭卡紅茶搭配優質在地鮮乳，口感滑順絲滑" },
      { name: "熟成莊園拿鐵", price: 60, category: "鮮奶系列", description: "嚴選熟成紅茶與職人鮮乳的完美邂逅，厚實好喝" },
      { name: "手作芋圓鮮奶", price: 65, category: "鮮奶系列", description: "慢火熬煮香Q小芋圓地瓜圓，注入純濃鮮乳" },
      { name: "黑糖波霸醇奶", price: 65, category: "香醇奶茶", description: "濃縮手炒黑糖蜜波霸，無咖啡因，純奶濃滑" },
      { name: "蜂蜜檸檬蘆薈", price: 55, category: "清涼調飲", description: "天然蜂蜜與鮮搾檸檬汁的酸甜比例，加上Q彈蘆薈" },
      { name: "炭焙拿鐵咖啡", price: 70, category: "嚴選咖啡", description: "頂級阿拉比卡焙煎咖啡豆與濃純鮮乳的細緻融合" }
    ];

    // SVG 圖示元件 - 防止外部載入失敗，保證視覺品質
    const Icons = {
      Coffee: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 animate-bounce-slow" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      ),
      Plus: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      ),
      Minus: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M20 12H4" />
        </svg>
      ),
      Trash: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Edit: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      ),
      Loader: ({ className = "w-5 h-5" }) => (
        <svg className={`animate-spin ${className}`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      ),
      Check: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      ),
      User: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      ),
      Calendar: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      ),
      Search: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      ),
      Close: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      ),
      Refresh: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3-3 3 3m-3-3v12" />
        </svg>
      )
    };

    // 精美 Toast 通知元件
    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const timer = setTimeout(() => {
          onClose();
        }, 4000);
        return () => clearTimeout(timer);
      }, [onClose]);

      const bgClass = type === 'success' 
        ? 'bg-slate-900 border-orange-500/20 text-white shadow-xl shadow-orange-500/10' 
        : type === 'error' 
          ? 'bg-rose-950 border-rose-800 text-rose-100 shadow-xl shadow-rose-950/20' 
          : 'bg-slate-900 border-slate-800 text-white shadow-xl';

      return (
        <div className={`fixed top-6 right-6 z-50 flex items-center gap-3.5 px-6 py-4 rounded-2xl shadow-xl border ${bgClass} transition-all duration-300 transform translate-y-0 scale-100 animate-bounce-short`}>
          <span className="text-sm font-semibold tracking-wide">{message}</span>
          <button onClick={onClose} className="opacity-75 hover:opacity-100 focus:outline-none ml-2 text-orange-400">
            <Icons.Close />
          </button>
        </div>
      );
    }

    // ==========================================
    // OrderForm 元件
    // ==========================================
    function OrderForm({ menu, editingOrder, onSubmit, onCancelEdit, isSubmitting }) {
      const [name, setName] = useState("");
      const [selectedDrinkName, setSelectedDrinkName] = useState("");
      const [sugar, setSugar] = useState("半糖");
      const [ice, setIce] = useState("少冰");
      const [quantity, setQuantity] = useState(1);

      const sugarOptions = ["正常糖", "七分糖", "半糖", "微糖", "無糖"];
      const iceOptions = ["正常冰", "少冰", "微冰", "去冰", "溫熱"];

      useEffect(() => {
        if (menu && menu.length > 0 && !selectedDrinkName) {
          setSelectedDrinkName(menu[0].name);
        }
      }, [menu]);

      useEffect(() => {
        if (editingOrder) {
          setName(editingOrder.name);
          setSelectedDrinkName(editingOrder.drink);
          setSugar(editingOrder.sugar || "半糖");
          setIce(editingOrder.ice || "少冰");
          setQuantity(editingOrder.quantity || 1);
        } else {
          setName("");
          setSugar("半糖");
          setIce("少冰");
          setQuantity(1);
          if (menu && menu.length > 0) {
            setSelectedDrinkName(menu[0].name);
          }
        }
      }, [editingOrder, menu]);

      const currentDrink = useMemo(() => {
        return menu.find(item => item.name === selectedDrinkName) || menu[0];
      }, [selectedDrinkName, menu]);

      const calculatedTotal = useMemo(() => {
        if (!currentDrink) return 0;
        return currentDrink.price * quantity;
      }, [currentDrink, quantity]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          alert("請填寫您的訂購人姓名！");
          return;
        }
        if (!currentDrink) {
          alert("請選擇一杯飲料！");
          return;
        }

        const formData = {
          name: name.trim(),
          drink: currentDrink.name,
          sugar,
          ice,
          quantity,
          totalPrice: calculatedTotal
        };

        if (editingOrder) {
          formData.orderId = editingOrder.orderId;
        }

        onSubmit(formData);
      };

      return (
        <div className="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-slate-200/50 border border-slate-100 flex flex-col gap-6 scale-100 transition-all duration-300">
          <div>
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                <span className="w-2.5 h-6 bg-orange-500 rounded-full inline-block"></span>
                {editingOrder ? "修改我的訂單" : "快速填單"}
              </h2>
              {editingOrder && (
                <span className="text-[10px] bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-bold uppercase tracking-wider">
                  編輯模式
                </span>
              )}
            </div>
          </div>

          <form onSubmit={handleSubmit} className="space-y-5">
            {/* 訂購人姓名 */}
            <div>
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">訂購人姓名</label>
              <div className="relative">
                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                  <Icons.User />
                </div>
                <input
                  type="text"
                  required
                  placeholder="請輸入你的名字 (例: 王小明)"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="w-full bg-slate-50 border-none rounded-2xl pl-11 pr-4 py-4 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-200 transition-all font-medium"
                />
              </div>
            </div>

            {/* 選擇飲料 */}
            <div>
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">選擇飲料單品</label>
              <div className="relative">
                <select
                  value={selectedDrinkName}
                  onChange={(e) => setSelectedDrinkName(e.target.value)}
                  className="w-full bg-slate-50 border-none rounded-2xl px-4 py-4 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-200 transition-all font-medium appearance-none cursor-pointer"
                >
                  {menu.map((item, index) => (
                    <option key={index} value={item.name}>
                      {item.name} — NT$ {item.price}
                    </option>
                  ))}
                </select>
                <div className="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                  </svg>
                </div>
              </div>

              {/* 飲料備註與描述 (Bento風格卡片內嵌) */}
              {currentDrink && (
                <div className="mt-3 p-4 rounded-2xl bg-[#fffaf5] border border-orange-100/30 flex flex-col gap-1 fade-in">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] font-bold text-orange-600 bg-orange-100/50 px-2.5 py-0.5 rounded-md">
                      {currentDrink.category}
                    </span>
                    <span className="text-[10px] font-bold text-slate-400">
                      單價 NT$ {currentDrink.price}
                    </span>
                  </div>
                  <p className="text-slate-500 text-xs leading-relaxed mt-1 font-medium">
                    {currentDrink.description || "慢工熬製現調飲品，茶香醇厚。"}
                  </p>
                </div>
              )}
            </div>

            {/* 甜度設定 */}
            <div>
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">甜度設定</label>
              <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                {sugarOptions.map((opt) => {
                  const isSelected = sugar === opt;
                  return (
                    <button
                      type="button"
                      key={opt}
                      onClick={() => setSugar(opt)}
                      className={`flex-1 py-3 px-2 rounded-xl text-xs font-bold transition-all focus:outline-none cursor-pointer text-center whitespace-nowrap ${
                        isSelected
                          ? "bg-orange-500 text-white shadow-lg shadow-orange-200"
                          : "bg-white text-slate-600 border border-slate-100 hover:bg-slate-50 hover:border-slate-200"
                      }`}
                    >
                      {opt.replace("糖", "")}糖
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 冰塊設定 */}
            <div>
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">冰塊設定</label>
              <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                {iceOptions.map((opt) => {
                  const isSelected = ice === opt;
                  return (
                    <button
                      type="button"
                      key={opt}
                      onClick={() => setIce(opt)}
                      className={`flex-1 py-3 px-2 rounded-xl text-xs font-bold transition-all focus:outline-none cursor-pointer text-center whitespace-nowrap ${
                        isSelected
                          ? "bg-orange-500 text-white shadow-lg shadow-orange-200"
                          : "bg-white text-slate-600 border border-slate-100 hover:bg-slate-50 hover:border-slate-200"
                      }`}
                    >
                      {opt.replace("冰", "")}冰
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 數量調整和小計金額 (Bento精美下欄) */}
            <div className="flex items-center justify-between pt-5 border-t border-slate-100">
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5">數量</label>
                <div className="flex items-center bg-slate-100 rounded-xl p-1 gap-1">
                  <button
                    type="button"
                    disabled={quantity <= 1}
                    onClick={() => setQuantity(prev => Math.max(1, prev - 1))}
                    className="w-8 h-8 rounded-lg bg-white flex items-center justify-center text-slate-600 shadow-sm border border-transparent active:scale-95 disabled:opacity-40 transition-all font-bold cursor-pointer"
                  >
                    <Icons.Minus />
                  </button>
                  <span className="w-9 text-center text-sm font-bold text-slate-700">
                    {String(quantity).padStart(2, '0')}
                  </span>
                  <button
                    type="button"
                    onClick={() => setQuantity(prev => prev + 1)}
                    className="w-8 h-8 rounded-lg bg-white flex items-center justify-center text-slate-600 shadow-sm border border-transparent active:scale-95 transition-all font-bold cursor-pointer"
                  >
                    <Icons.Plus />
                  </button>
                </div>
              </div>

              <div className="text-right">
                <div className="text-xs text-slate-400 font-bold uppercase tracking-wider">小計金額</div>
                <div className="text-3xl font-black text-slate-800 mt-1">
                  ${calculatedTotal}
                </div>
              </div>
            </div>

            {/* 送出與取消 */}
            <div className="flex flex-col gap-2 pt-2">
              <button
                type="submit"
                disabled={isSubmitting}
                className="w-full bg-slate-900 text-white rounded-2xl py-4.5 font-bold text-base shadow-xl hover:bg-slate-800 active:scale-99 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-75 disabled:cursor-not-allowed"
              >
                {isSubmitting ? (
                  <>
                    <Icons.Loader className="w-5 h-5 text-orange-400" />
                    <span>傳送中...</span>
                  </>
                ) : (
                  <>
                    <span>{editingOrder ? "保存並修改訂單" : "確認並送出訂單"}</span>
                  </>
                )}
              </button>

              {editingOrder && (
                <button
                  type="button"
                  onClick={onCancelEdit}
                  className="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 px-6 rounded-2xl transition-all text-xs"
                >
                  切回新增點單模式
                </button>
              )}
            </div>
          </form>
        </div>
      );
    }

    // ==========================================
    // OrderList 元件 (Bento Grid 樣式，精美訂單列表 & 彩色統計方塊群)
    // ==========================================
    function OrderList({ orders, menu, onEdit, onDelete, activeOrderId, stats, showToast }) {
      const [searchTerm, setSearchTerm] = useState("");

      const filteredOrders = useMemo(() => {
        if (!searchTerm.trim()) return orders;
        return orders.filter(o => o.name.toLowerCase().includes(searchTerm.toLowerCase()));
      }, [orders, searchTerm]);

      const getAvatarLetter = (name) => {
        return name ? name.substring(0, 1).toUpperCase() : "?";
      };

      const formatTime = (timeStr) => {
        if (!timeStr) return "下午";
        try {
          const date = new Date(timeStr);
          if (isNaN(date.getTime())) return "下午";
          const hours = String(date.getHours()).padStart(2, "0");
          const minutes = String(date.getMinutes()).padStart(2, "0");
          return `${hours}:${minutes} ${date.getHours() >= 12 ? 'PM' : 'AM'}`;
        } catch (e) {
          return "下午";
        }
      };

      // Excel / CSV 格式下載 (解決繁體中文在 Excel 中開啟亂碼問題，加上 UTF-8 BOM)
      const handleDownloadCSV = () => {
        if (orders.length === 0) return;
        
        const headers = ["訂購人", "飲料單品", "糖度", "冰塊", "數量", "單筆總計(元)", "訂購時間"];
        const rows = orders.map(o => {
          const time = o.timestamp ? new Date(o.timestamp).toLocaleString("zh-TW") : "剛剛";
          return [
            o.name,
            o.drink,
            o.sugar,
            o.ice,
            o.quantity,
            o.totalPrice,
            time
          ];
        });
        
        const csvContent = "\uFEFF" + [headers, ...rows]
          .map(e => e.map(val => `"${String(val).replace(/"/g, '""')}"`).join(","))
          .join("\n");
          
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        
        const today = new Date();
        const dateStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, "0")}${String(today.getDate()).padStart(2, "0")}`;
        link.setAttribute("download", `辦公室飲料點單明細_${dateStr}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        if (showToast) {
          showToast("✨ Excel / CSV 檔案下載成功！", "success");
        }
      };

      // LINE/Slack 貼心直覺複製
      const handleCopySummary = () => {
        if (orders.length === 0) return;
        
        const summaryByDrink = {};
        orders.forEach(o => {
          if (!summaryByDrink[o.drink]) {
            summaryByDrink[o.drink] = {
              totalCups: 0,
              items: {}
            };
          }
          summaryByDrink[o.drink].totalCups += o.quantity;
          
          const specKey = `${o.sugar} / ${o.ice}`;
          if (!summaryByDrink[o.drink].items[specKey]) {
            summaryByDrink[o.drink].items[specKey] = [];
          }
          summaryByDrink[o.drink].items[specKey].push({ name: o.name, quantity: o.quantity });
        });

        const today = new Date();
        const dateStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
        let text = `🥤 辦公室下午茶點單彙整 (${dateStr}) 🥤\n`;
        text += `===================================\n\n`;
        
        Object.entries(summaryByDrink).forEach(([drinkName, data]) => {
          text += `▪️ 【${drinkName}】 (總計 ${data.totalCups} 杯)\n`;
          Object.entries(data.items).forEach(([spec, detailList]) => {
            const names = detailList.map(d => `${d.name} (${d.quantity}杯)`).join(", ");
            const specSum = detailList.reduce((acc, d) => acc + d.quantity, 0);
            text += `   👉 [ ${spec} ] * ${specSum} 杯  (訂購人: ${names})\n`;
          });
          text += `\n`;
        });
        
        const totalCups = orders.reduce((acc, o) => acc + o.quantity, 0);
        const totalAmount = orders.reduce((acc, o) => acc + o.totalPrice, 0);
        const peopleCount = new Set(orders.map(o => o.name)).size;
        
        text += `===================================\n`;
        text += `📊 統計摘要：參與成員共 ${peopleCount} 人，合計 ${totalCups} 杯\n`;
        text += `💰 總金額為：NT$ ${totalAmount} 元\n\n`;
        text += `✨ 使用「辦公室飲料訂購系統」一鍵彙整。歡迎直接傳給飲料店！`;

        navigator.clipboard.writeText(text).then(() => {
          if (showToast) {
            showToast("📋 已複製 LINE / Slack 點單格式至剪貼簿！", "success");
          }
        }).catch((err) => {
          console.error("無法複製到剪貼簿，轉為下載 TXT 檔", err);
          const blob = new Blob([text], { type: "text/plain;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.setAttribute("href", url);
          link.setAttribute("download", `今日點單統整_${dateStr}.txt`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          if (showToast) {
            showToast("✨ 已轉為 TXT 點單檔下載！", "success");
          }
        });
      };

      return (
        <div className="flex flex-col gap-6 h-full">
          
          {/* Bento-grid 精美彩色數據統計板 (移入此處以便與右欄完全對齊排版) */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 h-auto lg:h-24">
            {/* 橘色格 (人氣之選) */}
            <div className="bg-orange-50 rounded-[1.5rem] p-4 flex flex-col justify-center border border-orange-100 shadow-sm shadow-orange-100/10">
              <span className="text-[10px] uppercase font-bold text-orange-500 tracking-wider">人氣之選</span>
              <span className="text-base lg:text-lg font-bold text-orange-950 truncate mt-1" title={stats.popularDrink}>
                {stats.popularDrink}
              </span>
            </div>
            {/* 藍色格 (參與人數) */}
            <div className="bg-blue-50 rounded-[1.5rem] p-4 flex flex-col justify-center border border-blue-100 shadow-sm shadow-blue-100/10">
              <span className="text-[10px] uppercase font-bold text-blue-500 tracking-wider">參與人數</span>
              <span className="text-base lg:text-lg font-bold text-blue-900 mt-1">
                {stats.peopleCount} 筆點單
              </span>
            </div>
            {/* 綠色格 (已收數量/總杯數) */}
            <div className="bg-emerald-50 rounded-[1.5rem] p-4 flex flex-col justify-center border border-emerald-100 shadow-sm shadow-emerald-100/10">
              <span className="text-[10px] uppercase font-bold text-emerald-500 tracking-wider">點購杯數</span>
              <span className="text-base lg:text-lg font-bold text-emerald-950 mt-1">
                {stats.totalCups} 杯
              </span>
            </div>
            {/* 琥珀色格 (目前總計金額) */}
            <div className="bg-amber-50 rounded-[1.5rem] p-4 flex flex-col justify-center border border-amber-100 shadow-sm shadow-amber-100/10">
              <span className="text-[10px] uppercase font-bold text-amber-500 tracking-wider">目前總計</span>
              <span className="text-base lg:text-lg font-bold text-amber-900 mt-1">
                ${stats.totalAmount} 元
              </span>
            </div>
          </div>

          {/* 今日訂單列表 Bento 卡片 */}
          <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-8 flex-1 flex flex-col overflow-hidden">
            <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-100">
              <div>
                <h2 className="text-lg font-semibold text-slate-800">今日訂單明細</h2>
              </div>

              {/* 搜尋 + 匯出與下載清單功能 */}
              <div className="flex flex-wrap items-center gap-2">
                {orders.length > 0 && (
                  <>
                    {/* 一鍵複製 LINE/Slack 直覺彙整格式 */}
                    <button
                      onClick={handleCopySummary}
                      type="button"
                      className="text-xs font-bold text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-250 px-3.5 py-2.5 rounded-xl transition-all cursor-pointer flex items-center gap-1.5 border border-slate-200/50 active:scale-95 text-center whitespace-nowrap"
                      title="彙整製作完美的 LINE / Slack 點單摘要"
                    >
                      <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                      </svg>
                      <span>複製 LINE 格式</span>
                    </button>

                    {/* 下載 CSV 檔 (Excel) */}
                    <button
                      onClick={handleDownloadCSV}
                      type="button"
                      className="text-xs font-bold text-orange-600 hover:text-orange-700 bg-orange-50 hover:bg-orange-100/80 px-3.5 py-2.5 rounded-xl transition-all cursor-pointer flex items-center gap-1.5 border border-orange-100/80 active:scale-95 text-center whitespace-nowrap"
                      title="下載今日 Excel CSV 報表"
                    >
                      <svg className="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                      </svg>
                      <span>下載 Excel CSV</span>
                    </button>

                    {/* 搜尋欄 */}
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <Icons.Search />
                      </div>
                      <input
                        type="text"
                        placeholder="搜尋訂購人..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full sm:w-36 bg-slate-50 border-none rounded-xl pl-9 pr-3 py-2.5 text-xs text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-1 focus:ring-orange-200 transition-all font-medium"
                      />
                    </div>
                  </>
                )}
              </div>
            </div>

            {/* 如果沒有任何人訂購 */}
            {orders.length === 0 ? (
              <div className="flex-1 min-h-[300px] flex flex-col items-center justify-center p-8 border-2 border-dashed border-slate-100 rounded-[2rem] bg-slate-50/50 text-center animate-pulse-soft">
                <div className="mb-4 text-orange-500 bg-orange-50 p-4.5 rounded-full shadow-inner">
                  <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M15.182 15.182a4.5 4.5 0 01-6.364 0M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <h3 className="text-sm font-bold text-slate-700 uppercase tracking-widest">今天目前尚無任何訂單</h3>
                <p className="text-xs text-slate-400 max-w-sm mt-2 leading-relaxed font-medium">
                  下午茶時間需要一杯美味手搖來提神！☕<br />
                  快點在左側填寫表格送出，開啟大家今天的第一筆下午茶訂單吧！
                </p>
              </div>
            ) : filteredOrders.length === 0 ? (
              <div className="text-center py-12 text-slate-400 text-xs font-semibold">
                沒有符合「{searchTerm}」的訂單
              </div>
            ) : (
              <div className="flex-1 flex flex-col gap-3 overflow-y-auto pr-1 max-h-[480px]">
                {filteredOrders.map((order, idx) => {
                  const isEditingThis = activeOrderId === order.orderId;
                  return (
                    <div
                      key={order.orderId || idx}
                      className={`group flex items-center justify-between p-4 rounded-2xl transition-all duration-300 border fade-in ${
                        isEditingThis
                          ? "border-orange-400 bg-orange-50/50 shadow-md shadow-orange-100/10"
                          : "bg-slate-50 hover:bg-white hover:border-slate-100 hover:shadow-lg hover:shadow-slate-100 border-transparent"
                      }`}
                    >
                      <div className="flex items-center gap-4">
                        {/* 姓名簡寫頭像 */}
                        <div className={`w-12 h-12 bg-white text-slate-500 rounded-xl flex items-center justify-center font-bold shadow-sm shrink-0 border border-slate-100/50`}>
                          {getAvatarLetter(order.name)}
                        </div>

                        <div>
                          <div className="font-bold text-slate-800">
                            {order.name} <span className="text-slate-400 font-normal ml-2 text-sm">{order.drink}</span>
                          </div>
                          <div className="flex flex-wrap gap-1.5 mt-1.5 ">
                            <span className="text-[10px] px-2.5 py-0.5 bg-orange-100 text-orange-700 rounded-md font-bold">
                              {order.sugar}
                            </span>
                            <span className="text-[10px] px-2.5 py-0.5 bg-blue-100 text-blue-700 rounded-md font-bold">
                              {order.ice}
                            </span>
                            <span className="text-[10px] text-slate-400 font-bold px-2.5 py-0.5 bg-slate-200/50 rounded-md">
                              x {order.quantity}
                            </span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-4">
                        <div className="text-right">
                          <div className="text-base font-bold text-slate-800">${order.totalPrice}</div>
                          <div className="text-[10px] text-slate-400 font-bold mt-0.5">{formatTime(order.timestamp)}</div>
                        </div>

                        {/* 直覺編輯按鈕組 */}
                        <div className="flex gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                          <button
                            title="編輯"
                            onClick={() => onEdit(order)}
                            className="p-2 hover:bg-orange-50 text-orange-600 rounded-lg active:scale-90 transition-all cursor-pointer"
                          >
                            <Icons.Edit />
                          </button>
                          <button
                            title="刪除"
                            onClick={() => onDelete(order.orderId)}
                            className="p-2 hover:bg-red-50 text-red-500 rounded-lg active:scale-90 transition-all cursor-pointer"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}

                {/* 底部拉桿感裝飾 */}
                <div className="py-4 text-center">
                  <span className="text-[10px] text-slate-300 font-bold uppercase tracking-widest block">今日點單排程已就序</span>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // App 整合容器元件 (Bento Grid 整體風格版)
    // ==========================================
    function App() {
      const [menu, setMenu] = useState([]);
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [editingOrder, setEditingOrder] = useState(null);
      const [toast, setToast] = useState(null);
      const [deleteTargetId, setDeleteTargetId] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
      };

      const fetchLatestData = async (silent = false) => {
        if (!silent) setLoading(true);
        try {
          const res = await fetch(API_URL);
          if (!res.ok) throw new Error("HTTP error " + res.status);
          const data = await res.json();
          
          if (data.menu && data.menu.length > 0) {
            setMenu(data.menu);
          } else {
            setMenu(DEFAULT_MENU);
          }
          setOrders(data.orders || []);
        } catch (error) {
          console.error("載入 API 失敗:", error);
          setMenu(prev => prev.length > 0 ? prev : DEFAULT_MENU);
          showToast("連線後端錯誤，目前使用離線預設菜單！", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchLatestData();
      }, []);

      const stats = useMemo(() => {
        const totalCups = orders.reduce((acc, o) => acc + o.quantity, 0);
        const totalAmount = orders.reduce((acc, o) => acc + o.totalPrice, 0);
        const names = new Set(orders.map(o => o.name));
        const peopleCount = names.size;

        const drinkCounts = {};
        orders.forEach(o => {
          drinkCounts[o.drink] = (drinkCounts[o.drink] || 0) + o.quantity;
        });
        let popularDrink = "暫無";
        let maxCount = 0;
        for (const [drink, count] of Object.entries(drinkCounts)) {
          if (count > maxCount) {
            maxCount = count;
            popularDrink = drink;
          }
        }

        return { totalCups, totalAmount, peopleCount, popularDrink };
      }, [orders]);

      const handleSubmitOrder = async (formData) => {
        setSubmitting(true);
        const isEdit = !!formData.orderId;
        
        const payload = {
          action: isEdit ? "update" : "create",
          data: formData
        };

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) throw new Error("傳送失敗, 伺服器狀態碼: " + res.status);
          const result = await res.json();

          if (result.status === "success") {
            showToast(isEdit ? "訂單已成功修正！" : "訂單登錄成功！下午茶有譜囉 🥤", "success");
            setEditingOrder(null);
            await fetchLatestData(true);
          } else {
            showToast("伺服器回應錯誤: " + (result.message || "未知原因"), "error");
          }
        } catch (error) {
          console.error("提交失敗:", error);
          showToast("網路異常或跨域錯誤，請檢查連線！", "error");
        } finally {
          setSubmitting(false);
        }
      };

      const handleDeleteOrder = async (orderId) => {
        // 使用自訂確認 Modal 替代 iframe 中容易被封鎖的 window.confirm
        setDeleteTargetId(orderId);
      };

      const executeDeleteOrder = async () => {
        if (!deleteTargetId) return;
        const orderId = deleteTargetId;
        setDeleteTargetId(null);
        setSubmitting(true);
        try {
          const payload = {
            action: "delete",
            data: { orderId }
          };

          const res = await fetch(API_URL, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) throw new Error("HTTP 刪除失敗 " + res.status);
          const result = await res.json();

          if (result.status === "success") {
            showToast("您的訂購項目已成功移除！", "success");
            if (editingOrder && editingOrder.orderId === orderId) {
              setEditingOrder(null);
            }
            await fetchLatestData(true);
          } else {
            showToast("刪除失敗: " + (result.message || "未知原因"), "error");
          }
        } catch (error) {
          console.error("刪除失敗:", error);
          showToast("連線至伺服器失敗，請確認網路！", "error");
        } finally {
          setSubmitting(false);
        }
      };

      const handleEditClick = (order) => {
        setEditingOrder(order);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleCancelEdit = () => {
        setEditingOrder(null);
      };

      const todayFormatted = useMemo(() => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const date = String(today.getDate()).padStart(2, "0");
        return `${year}年${month}月${date}日`;
      }, []);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-6 md:gap-8 min-h-screen">
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}

          {/* Custom Confirmation Modal (Bento 風格確認對話框) */}
          {deleteTargetId && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div 
                className="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] transition-opacity duration-300"
                onClick={() => setDeleteTargetId(null)}
              ></div>
              <div className="relative bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl border border-slate-100 flex flex-col gap-6 scale-100 transition-all duration-300 fade-in">
                <div className="flex items-center gap-3 text-orange-650">
                  <span className="p-3 bg-orange-50 rounded-2xl block text-orange-650">
                    <svg className="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                  </span>
                  <h3 className="text-lg font-bold text-slate-800">確認移除訂單嗎？</h3>
                </div>
                <p className="text-xs text-slate-500 font-bold leading-relaxed">
                  刪除後，此筆訂單調度將從今日系統排程中徹底銷毀，無法恢復。請確認為您的個人操作！
                </p>
                <div className="flex gap-3">
                  <button
                    type="button"
                    onClick={() => setDeleteTargetId(null)}
                    className="flex-1 bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold py-3.5 px-4 rounded-xl text-xs tracking-wider transition-all cursor-pointer border border-slate-100"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={executeDeleteOrder}
                    className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 px-4 rounded-xl text-xs tracking-wider transition-all shadow-lg shadow-rose-200 cursor-pointer"
                  >
                    確認移除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Header Section (符合Bento大圓角白底標題面板) */}
          <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-6 sm:p-8 rounded-[2rem] shadow-xs border border-slate-100 gap-4">
            <div>
              <h1 className="text-xl sm:text-2xl font-black bg-gradient-to-r from-orange-600 via-orange-500 to-amber-500 bg-clip-text text-transparent flex items-center gap-3">
                <span className="text-orange-500">
                  <Icons.Coffee />
                </span>
                午茶時光：辦公室訂餐系統
              </h1>
              <p className="text-slate-400 text-xs sm:text-sm font-bold mt-1 pl-9 flex items-center gap-1.5">
                <span>今日點單統計</span>
                <span className="w-1.5 h-1.5 rounded-full bg-orange-400 animate-ping"></span>
                <span>• {todayFormatted}</span>
              </p>
            </div>
            
            <div className="flex items-center gap-4 w-full sm:w-auto self-stretch sm:self-auto justify-between sm:justify-start border-t sm:border-t-0 border-slate-100 pt-4 sm:pt-0">
              <div className="flex gap-4">
                <div className="text-right">
                  <div className="text-lg sm:text-xl font-bold text-slate-800">{stats.totalCups} 份</div>
                  <div className="text-[10px] uppercase font-bold tracking-wider text-slate-400 mt-0.5">已收訂單</div>
                </div>
                <div className="w-[1px] bg-slate-200"></div>
                <div className="text-right">
                  <div className="text-lg sm:text-xl font-bold text-orange-600">${stats.totalAmount}</div>
                  <div className="text-[10px] uppercase font-bold tracking-wider text-slate-400 mt-0.5">目前總計</div>
                </div>
              </div>

              <button
                title="手動同步後端數據"
                disabled={loading}
                onClick={() => {
                  fetchLatestData();
                  showToast("已成功同步最新點單數據！", "success");
                }}
                className="p-3 rounded-2xl bg-slate-50 hover:bg-slate-100 active:scale-95 transition-all text-slate-500 border border-slate-150 focus:outline-none cursor-pointer flex items-center justify-center"
              >
                {loading ? <Icons.Loader className="w-4 h-4 text-orange-500" /> : <Icons.Refresh />}
              </button>
            </div>
          </header>

          {/* Main Layout Grid (Bento Columns) */}
          {loading && menu.length === 0 ? (
            <div className="flex-1 flex flex-col items-center justify-center p-24 text-slate-400 gap-3">
              <Icons.Loader className="w-10 h-10 text-orange-500" />
              <p className="text-sm font-bold text-slate-600 mt-2">茶飲配製中，載入菜單與今日訂單資料中...</p>
            </div>
          ) : (
            <main className="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
              {/* Order Form Column (占 5/12) */}
              <section className="col-span-12 lg:col-span-5 w-full">
                <OrderForm
                  menu={menu}
                  editingOrder={editingOrder}
                  onSubmit={handleSubmitOrder}
                  onCancelEdit={handleCancelEdit}
                  isSubmitting={submitting}
                />
              </section>

              {/* Order List Column (占 7/12) */}
              <section className="col-span-12 lg:col-span-7 w-full h-full">
                <OrderList
                  orders={orders}
                  menu={menu}
                  onEdit={handleEditClick}
                  onDelete={handleDeleteOrder}
                  activeOrderId={editingOrder ? editingOrder.orderId : null}
                  stats={stats}
                  showToast={showToast}
                />
              </section>
            </main>
          )}

          {/* Custom Branding / Decorative Footer */}
          <footer className="flex flex-col sm:flex-row justify-between items-center mt-auto py-6 border-t border-slate-100 text-slate-400 text-xs gap-4">
            <p className="font-medium">
              © 2026 Office Drink Order App · 設計完美聚合學
            </p>
            <div className="px-5 py-2 bg-slate-100 rounded-full text-[10px] font-black text-slate-400 tracking-[0.2em] uppercase">
              Professional Office Utility System v2.4
            </div>
          </footer>
        </div>
      );
    }

    // 將整個 App 渲染至 index.html
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
